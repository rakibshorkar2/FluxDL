name: Build IPA & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # brew install must never trigger a full Homebrew auto-update on CI.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build Unsigned IPA for iOS 18
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sources checked out here get mtimes NEWER than the cached build
      # products restored later (which carry the previous build's mtimes).
      # Xcode's up-to-date check compares mtimes, so without normalization
      # every Swift target would recompile on every push. Pin source mtimes
      # to a fixed past date; cached products are touched to "now" after
      # restore, guaranteeing products are always newer than sources.
      - name: Normalize source mtimes
        run: |
          find FluxDL FluxDL.xcodeproj Submodules -type f -exec touch -t 201001010000 {} +

      - name: Show Runner macOS and Xcode Versions
        run: |
          echo "Runner image: ${{ runner.os }}"
          sw_vers
          echo "--- Installed Xcode versions ---"
          ls /Applications | grep -i xcode || echo "No Xcode found in /Applications"
          echo "--- Installed Xcode list (system) ---"
          xcode-select -p
          xcodebuild -version

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          elif [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      # ───────────────────────────────────────────────────────────────────────
      # Native torrent fingerprint. Hashes ONLY the files that can affect the
      # libtorrent/LibTorrent native build: make.sh, the C++/Swift sources of
      # the LibTorrent-Swift stack, its Xcode project, the cmake-generated
      # project wiring, and the FluxDL project file (target/linker config).
      # Normal application Swift sources (Downloads/, Browser/, Proxy/,
      # Settings/, etc.) are deliberately NOT part of this fingerprint, so
      # editing them never invalidates the native caches below.
      # ───────────────────────────────────────────────────────────────────────
      - name: Compute Native Torrent Fingerprint
        id: native-fp
        run: |
          set -euo pipefail
          XCODE_VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          FILES_HASH=$(git ls-files \
              Submodules/LibTorrent-Swift/make.sh \
              Submodules/LibTorrent-Swift/LibTorrent \
              Submodules/LibTorrent-Swift/Thirdparty \
              Submodules/LibTorrent-Swift/LibTorrent.xcodeproj \
              FluxDL.xcodeproj/project.pbxproj \
              | sort -u | git hash-object --stdin-paths | shasum -a 256 | cut -c1-16)
          echo "libtorrent-files=${FILES_HASH}" >> "$GITHUB_OUTPUT"
          echo "xcode=${XCODE_VER}" >> "$GITHUB_OUTPUT"
          echo "sdk=${SDK_VER}" >> "$GITHUB_OUTPUT"
          echo "[CI] Native torrent fingerprint: Xcode ${XCODE_VER} / SDK ${SDK_VER} / files ${FILES_HASH}"

      - name: Cache Homebrew bottles (boost)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install Boost (libtorrent dependency)
        run: brew install boost

      # ───────────────────────────────────────────────────────────────────────
      # libtorrent cmake project (make.sh output). Skipped entirely on cache
      # hit. Incomplete restores are detected and healed by re-running make.sh.
      # ───────────────────────────────────────────────────────────────────────
      - name: Cache libtorrent cmake project (libtorrent-build)
        id: cache-lt
        uses: actions/cache@v4
        with:
          path: Submodules/LibTorrent-Swift/libtorrent-build
          key: lt-${{ runner.os }}-${{ steps.native-fp.outputs.xcode }}-${{ steps.native-fp.outputs.sdk }}-${{ steps.native-fp.outputs.libtorrent-files }}
          restore-keys: |
            lt-${{ runner.os }}-${{ steps.native-fp.outputs.xcode }}-${{ steps.native-fp.outputs.sdk }}-

      - name: Build libtorrent cmake project (make.sh)
        run: |
          if [[ "${{ steps.cache-lt.outputs.cache-hit }}" == "true" && -d Submodules/LibTorrent-Swift/libtorrent-build/libtorrent.xcodeproj ]]; then
            echo "[CI] libtorrent: CACHE HIT - SKIPPED make.sh"
          else
            echo "[CI] libtorrent: CACHE MISS - REBUILDING (running make.sh)"
            cd Submodules/LibTorrent-Swift
            bash make.sh
            ls -la libtorrent-build/libtorrent.xcodeproj
            test -d libtorrent-build/libtorrent.xcodeproj
            echo "[CI] make.sh completed successfully"
          fi

      # ───────────────────────────────────────────────────────────────────────
      # Xcode build intermediates (DerivedData). Reuses compiled C++/Swift
      # products across pushes so xcodebuild compiles only what changed.
      # Keyed on the native fingerprint + toolchain — app Swift edits keep
      # this cache valid (incremental build), native torrent edits or Xcode
      # changes invalidate it.
      # ───────────────────────────────────────────────────────────────────────
      - name: Cache Xcode DerivedData (build intermediates)
        id: cache-dd
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/Build
            build/DerivedData/SourcePackages
            build/DerivedData/ModuleCache.noindex
          key: dd-${{ runner.os }}-${{ steps.native-fp.outputs.xcode }}-${{ steps.native-fp.outputs.sdk }}-${{ steps.native-fp.outputs.libtorrent-files }}
          restore-keys: |
            dd-${{ runner.os }}-${{ steps.native-fp.outputs.xcode }}-${{ steps.native-fp.outputs.sdk }}-

      - name: Cache Swift Package Manager data (OpenSSL)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Submodules/LibTorrent-Swift/LibTorrent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cached build products must be NEWER than the pinned (2010) source
      # mtimes or Xcode recompiles every Swift target on every push.
      - name: Refresh restored build product mtimes
        if: steps.cache-dd.outputs.cache-hit == 'true'
        run: |
          find build/DerivedData -type f -exec touch {} +
          echo "[CI] Build product mtimes refreshed"

      - name: Resolve Swift packages
        run: |
          echo "[CI] Resolve Swift packages"
          xcodebuild -resolvePackageDependencies -project FluxDL.xcodeproj -scheme FluxDL

      - name: Build FluxDL iOS App
        run: |
          echo "[CI] libtorrent cmake project: ${{ steps.cache-lt.outputs.cache-hit == 'true' && 'CACHE HIT - SKIPPED' || 'CACHE MISS - REBUILDING' }}"
          echo "[CI] Xcode DerivedData:         ${{ steps.cache-dd.outputs.cache-hit == 'true' && 'CACHE HIT - INCREMENTAL BUILD' || 'CACHE MISS - FULL BUILD' }}"
          BUILD_NUMBER=${{ github.run_number }}
          START=$(date +%s)
          xcodebuild -project FluxDL.xcodeproj \
                     -scheme FluxDL \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath ./build/DerivedData \
                     CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     -disableAutomaticPackageResolution \
                     build
          echo "[CI] FluxDL build finished in $(( $(date +%s) - START ))s"

      - name: Create Unsigned IPA Package
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          APP_PATH=$(find ./build/DerivedData -name "FluxDL.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: FluxDL.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          OPENSSL_FW=$(find ./build/DerivedData/Build/Products -name "OpenSSL.framework" -type d | head -n 1)
          if [ -n "$OPENSSL_FW" ]; then
            cp -R "$OPENSSL_FW" "Payload/FluxDL.app/Frameworks/"
            echo "Embedded OpenSSL.framework into app Frameworks"
          else
            echo "Warning: OpenSSL.framework not found in build products"
          fi
          IPA="FluxDL-v1.0.0.${BUILD_NUMBER}.ipa"
          zip -r "$IPA" Payload
          if [ ! -s "$IPA" ]; then
            echo "Error: IPA is missing or empty — refusing to upload a stale package!"
            exit 1
          fi
          ls -lh "$IPA"
          echo "Successfully created ${IPA}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDL-Unsigned-IPA
          path: "FluxDL-v1.0.0.${{ github.run_number }}.ipa"
          retention-days: 30

      - name: Create GitHub Release with New Build Number
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          TAG="v1.0.0.${BUILD_NUMBER}"
          IPA="FluxDL-v1.0.0.${BUILD_NUMBER}.ipa"
          echo "Creating release ${TAG} with asset ${IPA}"
          if gh release view "${TAG}" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading asset to it"
            gh release upload "${TAG}" "${IPA}" --clobber
          else
            gh release create "${TAG}" "${IPA}" \
              --title "FluxDL v1.0.0 build ${BUILD_NUMBER}" \
              --notes "Automatic unsigned IPA release for build ${BUILD_NUMBER} (GitHub Actions run #${BUILD_NUMBER})." \
              --generate-notes
          fi
