name: "Build & Release Unsigned IPA"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_unsigned_ipa:
    name: Build Unsigned IPA & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Brew Dependencies
        run: brew install boost

      - name: Build LibTorrent Submodule
        run: |
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh

      - name: Set Build Number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild \
            -workspace FluxDL.xcworkspace \
            -scheme "FluxDL" \
            -archivePath $RUNNER_TEMP/FluxDL.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO \
            clean archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/FluxDL.xcarchive/Products/Applications/FluxDL.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r -y -q FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa Payload
          cp FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa $GITHUB_WORKSPACE/FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa
          path: FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FluxDL Release v1.0.${{ github.run_number }}
          body: |
            ## FluxDL Unsigned IPA Release (Build #${{ github.run_number }})

            - **Commit**: `${{ github.sha }}`
            - **Build Number**: `${{ github.run_number }}`

            ### Sideloading Instructions
            Download `FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa` below and sideload it to your iPhone using **AltStore**, **SideStore**, **TrollStore**, **Sideloadly**, or **LiveContainer**.
          files: |
            FluxDL-v1.0.${{ github.run_number }}-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
