name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          elif [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install Boost (libtorrent dependency)
        run: brew install boost

      - name: Generate libtorrent Xcode Project (LibTorrent-Swift dependency)
        run: |
          cd Submodules/LibTorrent-Swift
          bash make.sh
          ls -la libtorrent-build/libtorrent.xcodeproj

      - name: Create iPhone simulator from an installed runtime
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for rt in data.get('runtimes', []):
              if rt.get('isAvailable') and 'iOS' in rt.get('identifier', ''):
                  print(rt['identifier'])
                  sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$RUNTIME" ]; then
            echo "No installed iOS runtime found"
            exit 1
          fi
          UDID=$(xcrun simctl create "FluxDL CI Sim" "$RUNTIME")
          echo "RUNTIME=$RUNTIME"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Resolve package dependencies (OpenSSL)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FluxDL.xcodeproj \
            -scheme FluxDL

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FluxDL.xcodeproj \
            -scheme FluxDL \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FluxDL.xcodeproj \
            -scheme FluxDL \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
